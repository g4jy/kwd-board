name = "kwd-board-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Free 요금제는 SQLite 백엔드 Durable Object 만 쓸 수 있다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# T136ak 접근 통제 스위치 (값만 바꿔 다시 배포하면 켜고 끔)
#   WRITE_GUARD  = "on"  → 쓰기 토큰(/wt) 없는 연결·자료 올리기 거절. "off" 면 예전처럼 방 이름만으로 쓰기
#   TEACHER_GUARD = "on" → 지난 날짜 교실 판은 선생님 토큰 연결만 쓰기(학생은 읽기만). 선생님 기기마다 ?tk= 토큰이 있어야 해서 기본 꺼짐
[vars]
WRITE_GUARD = "on"
TEACHER_GUARD = "off"
